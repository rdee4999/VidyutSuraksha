
name: Build Vidyut Suraksha APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
          cmdline-tools-version: '12266719'

      - name: Install Android SDK packages
        shell: bash
        run: |
          sdkmanager --licenses
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extract Android project
        shell: bash
        run: |
          unzip -q VidyutSuraksha_Android_Native_Project.zip -d .
          test -f VidyutSurakshaAndroid/app/build.gradle.kts

      
      - name: Fix Kotlin package declaration
        shell: bash
        run: |
          FILE="VidyutSurakshaAndroid/app/src/main/java/in/vidyutsuraksha/app/MainActivity.kt"
          python3 - "$FILE" <<'PY'
          import sys
          import re
          from pathlib import Path

          p = Path(sys.argv[1])
          s = p.read_text(encoding="utf-8-sig")
          s = re.sub(
              r'(?m)^\s*package\s+.*$',
              'package com.vidyutsuraksha.app',
              s,
              count=1
          )
          if not s.startswith("package com.vidyutsuraksha.app"):
              s = "package com.vidyutsuraksha.app\n\n" + s
          p.write_text(s, encoding="utf-8")
          print("Corrected Kotlin package declaration.")
          PY


      - name: Fix Java and Kotlin JVM targets
        shell: bash
        run: |
          FILE="VidyutSurakshaAndroid/app/build.gradle.kts"
          python3 - "$FILE" <<'PY'
          import sys
          from pathlib import Path

          p = Path(sys.argv[1])
          s = p.read_text()

          if "compileOptions {" not in s:
              s = s.replace(
                  "android {",
                  'android {\n    compileOptions {\n'
                  '        sourceCompatibility = JavaVersion.VERSION_17\n'
                  '        targetCompatibility = JavaVersion.VERSION_17\n'
                  '    }\n',
                  1
              )
          else:
              start = s.index("compileOptions {")
              end = s.index("}", start)
              block = s[start:end]
              import re
              block = re.sub(
                  r"sourceCompatibility\s*=\s*JavaVersion\.VERSION_[A-Z0-9_]+",
                  "sourceCompatibility = JavaVersion.VERSION_17", block
              )
              block = re.sub(
                  r"targetCompatibility\s*=\s*JavaVersion\.VERSION_[A-Z0-9_]+",
                  "targetCompatibility = JavaVersion.VERSION_17", block
              )
              s = s[:start] + block + s[end:]

          import re
          if "kotlinOptions {" in s:
              start = s.index("kotlinOptions {")
              end = s.index("}", start)
              block = s[start:end]
              if re.search(r'jvmTarget\s*=', block):
                  block = re.sub(r'jvmTarget\s*=\s*"[^"]+"',
                                 'jvmTarget = "17"', block)
              else:
                  block += '\n        jvmTarget = "17"\n    '
              s = s[:start] + block + s[end:]
          else:
              s = s.replace(
                  "android {",
                  'android {\n    kotlinOptions {\n'
                  '        jvmTarget = "17"\n'
                  '    }\n',
                  1
              )

          p.write_text(s)
          print("Updated Java and Kotlin targets to JVM 17")
          PY

      - name: Build APK
        run: gradle --no-daemon -p VidyutSurakshaAndroid assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VidyutSuraksha-debug-apk
          path: VidyutSurakshaAndroid/app/build/outputs/apk/debug/app-debug.apk
